name: Deploy to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:  # Allow manual deploys from the Actions tab

# One deploy at a time. On 28 Oct two pushes minutes apart ran their server builds side by side on
# the shared TEST box (which also hosts the RH-SHF portal); it ran out of resources, the build hung,
# and both the CRMS and the portal went down. A newer push now waits for the running one to finish.
concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history to diff changed migrations

      - name: Check for destructive migrations
        run: |
          chmod +x scripts/check-destructive-migrations.sh
          BASE="${{ github.event.before }}"
          # github.event.before is all-zeros for the first push / some dispatches.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          scripts/check-destructive-migrations.sh "$BASE" "${{ github.sha }}"

  deploy:
    needs: migration-safety  # deploy is blocked unless the safety check passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          # SSH keepalive so the long build over the connection doesn't drop
          cat >> ~/.ssh/config << 'EOF'
          Host *
            ServerAliveInterval=60
            ServerAliveCountMax=30
            TCPKeepAlive=yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Create .env file
        env:
          # Pass the secret as a shell env var so the value is written verbatim,
          # even if it contains '$', backslashes, or other special characters.
          DEFAULTDB_CONNECTION: ${{ secrets.DEFAULTDB_CONNECTION }}
          # RH-SHF integration config. These override the gitignored appsettings.Production.json
          # (which never reaches the box via CI), so they MUST be supplied here as secrets.
          RHSHF_PUBLIC_BASE_URL: ${{ secrets.RHSHF_PUBLIC_BASE_URL }}
          RHSHF_API_KEY: ${{ secrets.RHSHF_API_KEY }}
          # The secret the portal verifies X-CRMS-Signature against. Without it the apps signed with
          # appsettings.json's placeholder and the portal answered every callback with 401 — on TEST,
          # none of Grandbai's updates ever arrived (CRMSQA#1/#2). Must match the portal's value.
          RHSHF_CALLBACK_SIGNING_SECRET: ${{ secrets.RHSHF_CALLBACK_SIGNING_SECRET }}
          # Real email on TEST. appsettings.json ships Email:UseMock=true, so TEST "sent" every email
          # to a mock that only logs — QA never received one (CRMSQA#2). With keys set they are used;
          # without, SES falls back to the EC2 instance role, which then needs ses:SendEmail.
          # Region is Frankfurt (eu-central-1): that is where BOA's SES identities are verified. The
          # appsettings default, eu-west-1, refused every send as "identity not verified".
          EMAIL_SES_ACCESS_KEY: ${{ secrets.EMAIL_SES_ACCESS_KEY }}
          EMAIL_SES_SECRET_KEY: ${{ secrets.EMAIL_SES_SECRET_KEY }}
        run: |
          # One shared connection string for BOTH apps (CRMS.API + CRMS.Web.Intranet).
          cat > crms.env << EOF
          ConnectionStrings__DefaultConnection=$DEFAULTDB_CONNECTION
          Rhshf__PublicBaseUrl=$RHSHF_PUBLIC_BASE_URL
          Rhshf__ApiKey=$RHSHF_API_KEY
          Rhshf__CallbackUseMock=false
          Rhshf__PortalUrl=http://18.132.3.119:8982
          Email__UseMock=false
          Email__Region=eu-central-1
          EOF
          if [ -n "$EMAIL_SES_ACCESS_KEY" ] && [ -n "$EMAIL_SES_SECRET_KEY" ]; then
            echo "Email__AccessKey=$EMAIL_SES_ACCESS_KEY" >> crms.env
            echo "Email__SecretKey=$EMAIL_SES_SECRET_KEY" >> crms.env
          else
            echo "::warning::EMAIL_SES_ACCESS_KEY/EMAIL_SES_SECRET_KEY not set — SES will use the EC2 instance role; emails show as not delivered if it lacks ses:SendEmail."
          fi
          # Only when set: an empty override would sign with an empty key, which is no better than the
          # placeholder and harder to spot.
          if [ -n "$RHSHF_CALLBACK_SIGNING_SECRET" ]; then
            echo "Rhshf__CallbackSigningSecret=$RHSHF_CALLBACK_SIGNING_SECRET" >> crms.env
          else
            echo "::warning::RHSHF_CALLBACK_SIGNING_SECRET is not set — portal callbacks will be rejected."
          fi

      - name: Deploy to EC2
        timeout-minutes: 40
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # Create deployment package (source only; the images are rebuilt on the box)
          tar --warning=no-file-changed -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='*/bin' \
            --exclude='*/obj' \
            --exclude='.env' \
            --exclude='crms.env' \
            --exclude='deploy.tar.gz' \
            . || true

          # Copy the package and the env file to the EC2 instance
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy.tar.gz $EC2_USER@$EC2_HOST:/tmp/
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no crms.env $EC2_USER@$EC2_HOST:/tmp/crms.env

          # Build & run on the EC2 instance
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'ENDSSH'
            set -e

            # Isolated project directory (does not touch other apps on this shared box)
            sudo mkdir -p /opt/crms
            sudo chown $USER:$USER /opt/crms
            cd /opt/crms

            # Clear the previous checkout before extracting, so files DELETED since the last deploy
            # don't linger and get compiled by the Docker build. (This bit us once: a source file that
            # had been removed in git stayed on the box and failed the build against a deleted type.)
            # Safe: the .env is re-created below, and uploaded documents live in the crms-storage Docker
            # volume — not under /opt/crms — so they are untouched.
            sudo find /opt/crms -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +

            # Extract new code
            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz

            # Move the .env (shared connection string) into place
            cp /tmp/crms.env .env
            rm /tmp/crms.env

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
            fi

            # Install the Docker Compose plugin if not present
            if ! docker compose version &> /dev/null; then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            # Light disk hygiene only — dangling images. (Do NOT run a full
            # `system prune --volumes` here: this box may run other apps, and a shared
            # named volume holds CRMS uploaded documents.)
            sudo docker image prune -f || true

            # Build first, one image at a time, while the current containers keep serving. Building
            # both at once on this shared box exhausted it on 28 Oct. A failed build now stops the
            # deploy here with the old version still running, instead of after `down` with nothing
            # running — and pipefail stops `tee` from hiding the failure.
            set -o pipefail
            echo "Building CRMS.API..."
            sudo docker compose build crms-api 2>&1 | tee /tmp/crms-build.log \
              || { echo "CRMS.API build failed; the running version was left in place."; exit 1; }
            echo "Building CRMS.Web.Intranet..."
            sudo docker compose build crms-intranet 2>&1 | tee -a /tmp/crms-build.log \
              || { echo "CRMS.Web.Intranet build failed; the running version was left in place."; exit 1; }

            # Swap to the new images. `down` (no -v) keeps the crms-storage volume, so uploaded
            # documents survive the redeploy.
            sudo docker compose down || true
            sudo docker compose up -d

            echo "Deployment complete!"
            sudo docker ps
          ENDSSH

      - name: Health Check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Waiting for the apps to start (migrations + seeding run on first boot)..."
          sleep 45
          echo "Checking CRMS.API on :8980 ..."
          curl -f http://$EC2_HOST:8980/openapi/v1.json || echo "API may still be starting"
          echo ""
          echo "Checking CRMS.Web.Intranet on :8981 ..."
          curl -f http://$EC2_HOST:8981/login || echo "Intranet may still be starting"
          echo ""
          echo "=========================================="
          echo "Deployment URLs:"
          echo "  CRMS.API:          http://$EC2_HOST:8980  (Scalar docs: /scalar/v1)"
          echo "  CRMS.Web.Intranet: http://$EC2_HOST:8981  (redirects to /login)"
          echo "=========================================="
